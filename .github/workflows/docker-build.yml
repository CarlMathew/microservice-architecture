name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push the frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/frontend:${{ github.sha }}

      - name: Build and push the posts
        uses: docker/build-push-action@v7
        with:
          context: ./backend/posts
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/posts:latest
            ${{ secrets.DOCKER_USERNAME }}/posts:${{ github.sha }}

      - name: Build and push the comments
        uses: docker/build-push-action@7
        with:
          context: ./backend/comments
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/comments:latest
            ${{ secrets.DOCKER_USERNAME }}/comments:${{ github.sha }}
