services:
  frontend:
    build: ./frontend
    ports:
        - "5173:5173"
    depends_on:
        - posts
        - comments
    
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
          ignore:
           - node_modules/
           - dist/
           - package.json
           - package-lock.json
           - Dockerfile

        - action: rebuild
          path: ./frontend/package.json
        
        - action: rebuild
          path: ./frontend/package-lock.json

        - action: rebuild
          path: ./frontend/Dockerfile

  posts:
    build: ./backend/posts
    ports:
        - "3001:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/posts
      KAFKA_BROKER: kafka:9093
      REDIS_URL: redis://redis:6379
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_started
      redis:
        condition: service_healthy

    
    develop:
      watch:
        - action: sync
          path: ./backend/posts
          target: /app
          ignore:
            - node_modules/
            - package.json
            - package-lock.json
            - Dockerfile
        
        - action: rebuild
          path: ./backend/posts/package.json
        
        - action: rebuild
          path: ./backend/posts/package-lock.json

        - action: rebuild
          path: ./backend/posts/Dockerfile

  comments:
    build: ./backend/comments
    ports:
        - "3002:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/comments
      KAFKA_BROKER: kafka:9093
      REDIS_URL: redis://redis:6379
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_started
      redis:
        condition: service_healthy

    develop:
      watch:
        - action: sync
          path: ./backend/comments
          target: /app
          ignore:
            - node_modules/
            - package.json
            - package-lock.json
            - Dockerfile
        
        - action: rebuild
          path: ./backend/comments/package.json
        
        - action: rebuild
          path: ./backend/comments/package-lock.json

        - action: rebuild
          path: ./backend/comments/Dockerfile


  postgres:
    image: postgres:17-alpine
    environment: 
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  kafka:
    image: apache/kafka:latest
    ports:
        - "9092:9092"
    environment:
      KAFKA_LISTENERS: CONTROLLER://localhost:9091,HOST://0.0.0.0:9092,DOCKER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,HOST:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9091
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  redis:
    image: redis:7-alpine

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
    postgres_data: